# 
# Simulation time step
simulation_dt: 0.005
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 4

kps: [15, 15, 0.0, 15, 15, 0.0]
kds: [0.3, 0.3, 0.3, 0.3, 0.3, 0.3]

default_angles: [1.22, -1.92, 0.0, 1.22, -1.92, 0.0]
sit_angles: [1.48, -3.2, 0.0, 1.48, -3.2, 0.0]

lin_vel_scale: 2.0
ang_vel_scale: 0.5  # 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05

pos_action_scale: 0.25 
vel_action_scale: 0.5

cmd_scale: [2.0, 2.0, 0.25, 1.0]
num_actions: 6
num_obs: 156
one_step_obs_size: 26
obs_buffer_size: 6

cmd_init: [0.0, 0.0, 0.0, 0.3]
